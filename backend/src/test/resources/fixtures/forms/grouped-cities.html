<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例科技 · 在线申请 · 意向城市</title>
<!-- 手动冒烟用的虚构表单，和 grouped-cities.scenario.json 表达同一个表单：按省份分组的城市多选。 -->
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  section[hidden] { display: none; }
  fieldset { margin: .5rem 0; }
  label { margin-right: 1rem; }
</style>
</head>
<body>
<section id="cities" data-title="示例科技 · 在线申请 · 意向城市">
  <h1>意向城市</h1>
  <p>第 1/2 步 · 可多选</p>
  <fieldset>
    <legend>意向城市（可多选）</legend>
    <fieldset><legend>广东</legend>
      <label><input type="checkbox"> 广州</label><label><input type="checkbox"> 深圳</label></fieldset>
    <fieldset><legend>浙江</legend>
      <label><input type="checkbox"> 杭州</label><label><input type="checkbox"> 宁波</label></fieldset>
    <fieldset><legend>江苏</legend>
      <label><input type="checkbox"> 南京</label><label><input type="checkbox"> 苏州</label></fieldset>
    <fieldset><legend>四川</legend>
      <label><input type="checkbox"> 成都</label></fieldset>
  </fieldset>
  <button type="button" data-go="review">下一步</button>
</section>
<section id="review" data-title="示例科技 · 在线申请 · 核对信息" hidden>
  <h1>核对信息</h1>
  <p>第 2/2 步</p>
  <button type="button" data-go="cities">上一步</button>
  <button type="button" data-go="submitted">提交申请</button>
</section>
<section id="submitted" data-title="示例科技 · 在线申请" hidden>
  <h1>投递成功</h1>
</section>
<script>
  document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => {
    document.querySelectorAll('section').forEach(section => { section.hidden = section.id !== button.dataset.go; });
    document.title = document.getElementById(button.dataset.go).dataset.title;
  }));
</script>
</body>
</html>
