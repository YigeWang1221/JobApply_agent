<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例科技 · 在线申请 · 基本信息</title>
<!-- 手动冒烟用的虚构表单，和 verification.scenario.json 表达同一个表单：
     默认（basic）：点「下一步」后弹出「请完成安全验证」（页面内的滑块浮层，不是浏览器弹窗）。
     加上 #sms（sms）：表单上自带「短信验证码」输入框。 -->
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  section[hidden], [role=dialog][hidden] { display: none; }
  label { display: block; margin: .75rem 0; }
  [role=dialog] { position: fixed; inset: 20% 25%; background: #fff; border: 1px solid #999; padding: 1rem; }
</style>
</head>
<body>
<section id="basic" data-title="示例科技 · 在线申请 · 基本信息">
  <h1>基本信息</h1>
  <p>第 1/2 步</p>
  <label>姓名 <input type="text" aria-label="姓名"></label>
  <label>邮箱 <input type="email" aria-label="邮箱"></label>
  <button type="button" id="next">下一步</button>
  <div role="dialog" aria-label="安全验证" id="challenge" hidden>
    <h2>请完成安全验证</h2>
    <p>向右拖动滑块，完成拼图</p>
    <input type="range" aria-label="拖动滑块" min="0" max="100" value="0">
    <button type="button">换一张</button>
    <button type="button" id="close">关闭</button>
  </div>
</section>
<section id="sms" data-title="示例科技 · 在线申请 · 联系方式" hidden>
  <h1>联系方式</h1>
  <p>第 1/2 步</p>
  <label>姓名 <input type="text" aria-label="姓名"></label>
  <label>手机号 <input type="tel" aria-label="手机号"></label>
  <label>短信验证码 <input type="text" aria-label="短信验证码"></label>
  <button type="button">获取验证码</button>
  <button type="button" data-go="sms-review">下一步</button>
</section>
<section id="sms-review" data-title="示例科技 · 在线申请 · 核对信息" hidden>
  <h1>核对信息</h1>
  <p>第 2/2 步</p>
  <button type="button" data-go="sms">上一步</button>
  <button type="button" data-go="submitted">提交申请</button>
</section>
<section id="submitted" data-title="示例科技 · 在线申请" hidden>
  <h1>投递成功</h1>
</section>
<script>
  function show(id) {
    document.querySelectorAll('section').forEach(section => { section.hidden = section.id !== id; });
    document.title = document.getElementById(id).dataset.title;
  }
  if (location.hash === '#sms') {
    show('sms');
  }
  const challenge = document.getElementById('challenge');
  document.getElementById('next').addEventListener('click', () => { challenge.hidden = false; });
  document.getElementById('close').addEventListener('click', () => { challenge.hidden = true; });
  document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => show(button.dataset.go)));
</script>
</body>
</html>
