<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例科技 · 在线申请 · 基本信息</title>
<!-- 手动冒烟用的虚构表单，和 dialog.scenario.json 表达同一个表单：点「下一步」时网页弹出确认框（window.confirm）。
     用户在确认框里点「确定」才进入核对页。 -->
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  section[hidden] { display: none; }
  label { display: block; margin: .75rem 0; }
</style>
</head>
<body>
<section id="basic" data-title="示例科技 · 在线申请 · 基本信息">
  <h1>基本信息</h1>
  <p>第 1/2 步</p>
  <label>姓名 <input type="text" aria-label="姓名"></label>
  <label>邮箱 <input type="email" aria-label="邮箱"></label>
  <button type="button" id="next">下一步</button>
</section>
<section id="review" data-title="示例科技 · 在线申请 · 核对信息" hidden>
  <h1>核对信息</h1>
  <p>第 2/2 步</p>
  <button type="button" data-go="basic">上一步</button>
  <button type="button" data-go="submitted">提交申请</button>
</section>
<section id="submitted" data-title="示例科技 · 在线申请" hidden>
  <h1>投递成功</h1>
</section>
<script>
  function show(id) {
    document.querySelectorAll('section').forEach(section => { section.hidden = section.id !== id; });
    document.title = document.getElementById(id).dataset.title;
  }
  document.getElementById('next').addEventListener('click', () => {
    if (window.confirm('进入下一步后，本页内容将不能再修改。是否继续？')) {
      show('review');
    }
  });
  document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => show(button.dataset.go)));
</script>
</body>
</html>
