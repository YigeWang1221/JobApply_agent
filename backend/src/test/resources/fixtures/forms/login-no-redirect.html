<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例科技 · 后端工程师（示例）</title>
<!-- 手动冒烟用的虚构页面，和 login-no-redirect.scenario.json 表达同一个页面：点「登录」后网址不变，
     只是页头多出用户名和「退出登录」。没有真的登录，只切换页头。 -->
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  [hidden] { display: none; }
  header { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: .5rem; }
</style>
</head>
<body>
<header id="guest-header">
  <a href="#">示例科技招聘</a>
  <button type="button" class="login">登录</button>
  <a href="#">注册</a>
</header>
<header id="member-header" hidden>
  <a href="#">示例科技招聘</a>
  <span>示例用户</span>
  <a href="#">我的投递</a>
  <button type="button" id="logout">退出登录</button>
</header>
<main id="job">
  <h1>后端工程师（示例）</h1>
  <p>示例城市 · 全职<span id="hint"> · 请先登录</span></p>
  <button type="button" class="login" id="guest-apply">去登录</button>
  <button type="button" id="member-apply" hidden>立即申请</button>
</main>
<main id="submitted" hidden>
  <h1>投递成功</h1>
</main>
<script>
  function signedIn(yes) {
    document.getElementById('guest-header').hidden = yes;
    document.getElementById('member-header').hidden = !yes;
    document.getElementById('hint').hidden = yes;
    document.getElementById('guest-apply').hidden = yes;
    document.getElementById('member-apply').hidden = !yes;
  }
  document.querySelectorAll('.login').forEach(button => button.addEventListener('click', () => signedIn(true)));
  document.getElementById('logout').addEventListener('click', () => signedIn(false));
  document.getElementById('member-apply').addEventListener('click', () => {
    document.getElementById('job').hidden = true;
    document.getElementById('submitted').hidden = false;
  });
</script>
</body>
</html>
