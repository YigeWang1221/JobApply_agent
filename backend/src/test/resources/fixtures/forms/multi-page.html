<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例科技 · 在线申请 · 基本信息</title>
<!-- 手动冒烟用的虚构表单，和 multi-page.scenario.json 表达同一个表单：三页，每页一个「下一步」，最后一页是「提交申请」。 -->
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  section[hidden] { display: none; }
  label { display: block; margin: .75rem 0; }
</style>
</head>
<body>
<header><span>示例用户</span></header>
<form id="form" onsubmit="return false">
  <section id="basic" data-title="示例科技 · 在线申请 · 基本信息">
    <h1>基本信息</h1>
    <p>第 1/3 步</p>
    <label>姓名 <input type="text" aria-label="姓名"></label>
    <label>邮箱 <input type="email" aria-label="邮箱"></label>
    <label>手机号 <input type="tel" aria-label="手机号"></label>
    <label>性别
      <select aria-label="性别"><option>男</option><option>女</option></select>
    </label>
    <button type="button" data-go="education">下一步</button>
  </section>
  <section id="education" data-title="示例科技 · 在线申请 · 教育经历" hidden>
    <h1>教育经历</h1>
    <p>第 2/3 步</p>
    <label>学校 <input type="text" aria-label="学校"></label>
    <label>专业 <input type="text" aria-label="专业"></label>
    <label>学历
      <select aria-label="学历"><option>本科</option><option>硕士</option><option>博士</option></select>
    </label>
    <label>毕业时间 <input type="text" aria-label="毕业时间"></label>
    <button type="button" data-go="basic">上一步</button>
    <button type="button" data-go="review">下一步</button>
  </section>
  <section id="review" data-title="示例科技 · 在线申请 · 核对信息" hidden>
    <h1>核对信息</h1>
    <p>第 3/3 步</p>
    <label>自我评价 <textarea aria-label="自我评价"></textarea></label>
    <button type="button" data-go="education">上一步</button>
    <button type="button" data-go="submitted">提交申请</button>
  </section>
  <section id="submitted" data-title="示例科技 · 在线申请" hidden>
    <h1>投递成功</h1>
    <p>感谢您的申请</p>
  </section>
</form>
<script>
  document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => {
    document.querySelectorAll('section').forEach(section => { section.hidden = section.id !== button.dataset.go; });
    document.title = document.getElementById(button.dataset.go).dataset.title;
  }));
</script>
</body>
</html>
