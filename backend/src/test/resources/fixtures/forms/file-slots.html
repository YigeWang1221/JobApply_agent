<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>示例科技 · 在线申请 · 附件</title>
<!-- 手动冒烟用的虚构表单，和 file-slots.scenario.json 表达同一个表单：简历和作品集两个上传位置。 -->
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; }
  section[hidden] { display: none; }
  fieldset { margin: 1rem 0; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<section id="materials" data-title="示例科技 · 在线申请 · 附件">
  <h1>附件材料</h1>
  <p>第 1/2 步</p>
  <fieldset>
    <legend>简历（必填，PDF）</legend>
    <input type="file" id="resume" accept=".pdf">
    <button type="button" data-pick="resume">上传简历</button>
    <span aria-label="简历文件" id="resume-name">未上传</span>
  </fieldset>
  <fieldset>
    <legend>作品集（选填）</legend>
    <input type="file" id="portfolio">
    <button type="button" data-pick="portfolio">上传作品集</button>
    <span aria-label="作品集文件" id="portfolio-name">未上传</span>
  </fieldset>
  <button type="button" data-go="review">下一步</button>
</section>
<section id="review" data-title="示例科技 · 在线申请 · 核对信息" hidden>
  <h1>核对信息</h1>
  <p>第 2/2 步</p>
  <button type="button" data-go="materials">上一步</button>
  <button type="button" data-go="submitted">提交申请</button>
</section>
<section id="submitted" data-title="示例科技 · 在线申请" hidden>
  <h1>投递成功</h1>
</section>
<script>
  document.querySelectorAll('[data-pick]').forEach(button => button.addEventListener('click', () => {
    document.getElementById(button.dataset.pick).click();
  }));
  document.querySelectorAll('input[type=file]').forEach(input => input.addEventListener('change', () => {
    document.getElementById(input.id + '-name').textContent =
        Array.from(input.files).map(file => file.name).join(', ') || '未上传';
  }));
  document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => {
    document.querySelectorAll('section').forEach(section => { section.hidden = section.id !== button.dataset.go; });
    document.title = document.getElementById(button.dataset.go).dataset.title;
  }));
</script>
</body>
</html>
