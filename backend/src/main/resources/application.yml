spring:
  application:
    name: jobapply
  servlet:
    multipart:
      # 原件上传的上限（plan/coding/02-core-agent/C004-A-model-guard.md）
      max-file-size: 20MB
      max-request-size: 21MB

# 经验检索（C022）建索引时 SimpleVectorStore 每个片段记一行 INFO，太吵
logging:
  level:
    org.springframework.ai.vectorstore.SimpleVectorStore: WARN

# 本地 HTTP 只监听本机（plan/master/architecture.md「api」）
server:
  address: 127.0.0.1
  # 关闭时不等还没结束的请求（Boot 默认 graceful，最多等 30 秒）：界面一直开着 /api/events 推送，graceful 每次都等满 30 秒（C017-fix）
  shutdown: immediate
  tomcat:
    # 超过上传上限时仍读完请求体，才能把 413 返回给客户端，而不是直接断开连接
    max-swallow-size: 64MB

jobapply:
  api:
    # 带 Origin 请求头的请求只放行这些本机前端地址（Vite 开发服务器）
    allowed-origins: ["http://127.0.0.1:5173", "http://localhost:5173"]
  storage:
    # 在 backend/ 下启动时就是仓库的 storage/；只有调用接口时才会读写
    root: ../storage
  browser:
    mcp:
      # npx 不在 PATH 里时（例如从 IDE 启动），改成绝对路径
      command: npx
      # 写操作的返回不附带快照、不写快照文件；console 只留错误；不返回图片；不收集页面注册的 WebMCP 工具。
      # 动作超时（等元素可见、稳定、能接收点击）从默认 5 秒放到 15 秒：真实招聘站点有加载遮罩，5 秒常常还没消失。
      # 导航超时 25 秒（默认 60 秒）：比下面的 call-timeout 短，页面加载不完时先由 MCP 自己报导航超时（连接还好），
      # 不等到整个调用没有回话。
      # --output-dir（storage/cache/playwright-mcp）由程序按 storage 追加；不加 --caps
      # --init-page（storage/cache/playwright-init/no-bring-to-front.cjs）也由程序追加：切标签页时不把 Chrome 拉到所有应用前面（C011-fix）
      # 启动时还带 NODE_OPTIONS=--require storage/cache/playwright-init/skip-unresponsive-tabs.cjs（C011-fix 2026-10-25）：
      # Chrome 里睡着、卡住的标签页不再拖住连接（每页最多等 5 秒）和每次调用（取标题最多等 2 秒）
      # 远程调试模式：连用户自己正在用的 Chrome（用户的 profile 和登录），在
      # chrome://inspect/#remote-debugging 打开开关，只有第一次连接要确认，不用装扩展。
      # 直接连 ws://127.0.0.1:9222/devtools/browser（开关打开后 Chrome 默认监听 9222），不用 --cdp-endpoint chrome：
      # 那样 MCP 要去读 Chrome 资料夹里的 DevToolsActivePort，打包后的 App 读别的应用的数据会被 macOS 拦下（C017-fix）。
      # 写 127.0.0.1 不写 localhost：Chrome 只监听 IPv4
      # 程序还会追加 --port <随机空闲端口> --host 127.0.0.1 --shared-browser-context（C011）：一个服务进程、一条 CDP 连接，
      # 每个申请 / 调研各开一个 HTTP 会话（自己的标签页），另有一个空闲会话保住连接，Chrome 只弹一次允许
      args: ["-y", "@playwright/mcp@0.0.83", "--cdp-endpoint", "ws://127.0.0.1:9222/devtools/browser", "--snapshot-mode", "none", "--console-level", "error",
             "--image-responses", "omit", "--no-webmcp", "--timeout-action", "15000", "--timeout-navigation", "25000"]
      # 普通调用的超时：MCP 这么久没回话 = 浏览器卡住了（多半是 Chrome 里有标签页没响应），不当成断开、不重连（C011-fix）
      call-timeout: 30s
      # 建立连接：要长于 Chrome 等待用户同意第一次连接的时间
      connect-timeout: 60s
  search:
    # 可选：本机 SearXNG 的地址（例如 http://127.0.0.1:8888）；不写时跳过这一级。Brave 的 key 在 storage/settings/.env 的 BRAVE_API_KEY
    searxng-url: ""
  web:
    # 域名黑名单（照 Hermes 的 website_blocklist）：默认关、没有预设。打开后 web_fetch 和调研 Agent 的浏览器导航都不去这些域名，
    # 子域名也算，重定向后再查。内网、本机、云元数据地址和带凭证的网址一直拦，不在这里配
    blocklist:
      enabled: false
      domains: []
  harness:
    # Agent 循环的兜底上限：到了让模型总结做到哪了，交给用户决定要不要继续；0 = 不限。
    # 下面两项是默认值：设置页「工具调用上限」改过后存在 storage/settings/tool-calls.yaml，以它为准（C018）
    # 申请 Agent 一次运行最多这么多次工具调用
    tool-calls-per-run: 150
    # 对话 Agent 每条消息（一轮）最多这么多次工具调用
    tool-calls-per-message: 40
    # 重复操作的提醒（只在工具结果里告诉模型，不强制停）
    same-element-failures: 3
    same-result-repeats: 3
    unchanged-actions: 6
    # 同时跑的申请线程数（C011 Worker 池），多出来的排队按顺序轮到。下面两项是默认值：设置页「同时申请」改过后存在 storage/settings/workers.yaml，以它为准（C012）
    application-workers: 3
    # 同一个网站上同时最多这么多个申请（礼貌限速，免得同站点请求过多被限流）；多出来的排队
    applications-per-site: 2
  eval:
    # 评测模式（C025）：拦截这次申请标签页上的最终提交请求、每步存一份脱敏快照到 storage/eval/app/。默认关；
    # 设置页「评测」改过后存在 storage/settings/eval.yaml，以它为准。关着时主流程与没有这个功能时完全一样
    enabled: false
